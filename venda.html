    <div class="container" >
        <h3>Tela de Venda</h3>
      
        <div class="row">
            <div class="col-md-8"> 
               <form action="" method="post">
                <div class="row">

                  <div class="form-grupo col-md">
                    <label> produto </label>
                    <select class="form-control">
                        <option> Mouse </option>
                        <option> teclado </option>
                        <option> fone </option>

                    </select>
                  </div>

                  <div class="form-grupo col-md">
                    <label> Quantidade </label>
                    <input type="number" required class="form-control">
                  </div>
                    <div class="col-md">
                       <button type="submit" class="btn btn-primary" style="margin-top: 32px;">
                         <i class="fa-solid fa-plus"></i>
                       </button>
                    </div>

                    <table class="table mt-4 table-striped table-bordered table-sm">
                        <thead>
                            <th> produto </th>
                            <th> quantidade</th>
                            <th> valor unitario </th>
                            <th> valor total </th>
                            <th> opções</th>
                        </thead>
                   
                    <tbody>

                       <tr>
                        
                        <td> Mouse </td>
                        <td> 2 </td>
                        <td> 20 </td>
                        <td> 40 </td>
                        <td> <a href=""> excluir </a> </td> 
                       </tr>
                    </tbody>

                </table>


                </div>


               </form> 
            

            </div>
            <div class="col-md-4"> 
              <h3> resumo da venda </h3>

              <form action="" method="post">
               <div class="form-group">
                 <label> cliente </label>
                 <select class="form-control">
                   <option> joão </option>
                   <option> aline </option>
                 </select>
               </div>
               <div class="form-group">
                <label> Funcionario </label>
                <select class="form-control">
                  <option> Juliano </option>
                  <option> Tatiane </option>
                </select>
              </div>
      
             <div class="form-group">
              <label> Quantidade total </label>
              <input type="text" class="form-control" value="2">
      
             </div>
      
      
             <div class="form-group">
              <label> Valor total </label>
              <input type="text" class="form-control" value="40" readonly>
             </div>
      
             <div class="form-group">
              <label> Observação </label>
              <textarea class="form-control"></textarea>
      
             </div>
      
             <a href="" class="btn btn-success"><i class="fa-solid fa-cart-shopping"></i> Finalizar</a>
             <a href="./principal.php"  class="btn btn-danger"> cancelar </a>
      
              </form>

            </div>

        </div>
